[theme]
base = "light"
primaryColor = "#1f63c2"
backgroundColor = "#f4f6fb"
secondaryBackgroundColor = "#eaeff8"
textColor = "#162033"
borderColor = "#dde3ef"
baseRadius = "12px"
font = "Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"
headingFont = "Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"

[[theme.fontFaces]]
family = "Pretendard"
url = "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2"
weight = 400

[[theme.fontFaces]]
family = "Pretendard"
url = "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-SemiBold.woff2"
weight = 600

[[theme.fontFaces]]
family = "Pretendard"
url = "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Bold.woff2"
weight = 700

[theme.sidebar]
backgroundColor = "#0f1b33"
secondaryBackgroundColor = "#17274a"
textColor = "#d9e2f2"
primaryColor = "#7fb0ff"
borderColor = "#22345c"

[server]
headless = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
